# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "RecordCompositions"
  authors: [Kenny Lau]
  description: >
    `RecordCompositions` is a formal proof of the closed formulas for the record composition count
    $N(\alpha)$ of down-up alternating permutations, and of their counterpart in the algebra of
    noncommutative symmetric functions, from *Record compositions of alternating permutations and
    noncommutative symmetric functions* (arXiv:2607.12873). It proves Theorem 1.1, Theorem 1.2 and
    Theorem 1.3. The Lean files were generated by AxiomProver, Axiom Math's in-house theorem
    proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Record compositions of alternating permutations and noncommutative symmetric functions"
    authors: [Evan Chen, Ken Ono, Michal Mogielnicki]
    id: "https://arxiv.org/abs/2607.12873"
    type: "article"
    location: "Theorem 1.1, Theorem 1.2, Theorem 1.3"
    relationship: "formalizes"
    note: >
      Formalizes the binomial and multiplicative forms of $N(\alpha)$ and its realization as a
      coordinate of $(2n)!\,\mathbf{A}_n$ in `NSym`.

classification:
  arxiv: [math.CO, math.RT]
  msc2020: [05A05, 05A15, 05A19]

status:
  scope: >
    Theorem 1.1, Theorem 1.2 and Theorem 1.3, for every $n \ge 1$ and every composition
    $\alpha \vDash n$, with Theorem 1.3 over any field of characteristic zero. `problem.lean`
    models `NSym` as the free algebra on generators representing the noncommutative power sums
    $\Psi_k$, and `Sym` as a polynomial ring on generators representing the power sums $p_k$,
    with $\chi$ the map between them.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "N_eq_rhsBinom"
    file: "RecordCompositions/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "N_eq_rhsRat"
    file: "RecordCompositions/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "factorial_smul_Anc_eq"
    file: "RecordCompositions/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "chi_Anc_eq"
    file: "RecordCompositions/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `RecordCompositions/problem.lean` was checked against the source paper
    by an author of that paper.

alignment:
  statements:
    - source: "Record compositions of alternating permutations and noncommutative symmetric functions (Theorem 1.1)"
      lean: "N_eq_rhsBinom"
      module: "RecordCompositions.solution"
      status: "Proved."
    - source: "Record compositions of alternating permutations and noncommutative symmetric functions (Theorem 1.2)"
      lean: "N_eq_rhsRat"
      module: "RecordCompositions.solution"
      status: "Proved, over $\\mathbb{Q}$."
    - source: "Record compositions of alternating permutations and noncommutative symmetric functions (Theorem 1.3, the `NSym` expansion)"
      lean: "factorial_smul_Anc_eq"
      module: "RecordCompositions.solution"
      status: "Proved."
    - source: "Record compositions of alternating permutations and noncommutative symmetric functions (Theorem 1.3, $\\chi(\\mathbf{A}_n) = A_n$)"
      lean: "chi_Anc_eq"
      module: "RecordCompositions.solution"
      status: "Proved."
